name: 📋 말씀 동반자 목록 자동 갱신

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'generate_index.py'

  workflow_dispatch:   # 수동 실행 허용

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: index.html 생성
        run: python generate_index.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "📋 말씀 동반자 목록 자동 갱신"
          git push
